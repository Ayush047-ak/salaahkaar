[project]
name = "geospatial-service"
version = "0.1.0"
description = "Geospatial processing service for Salaahkaar"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "shapely>=2.0.3",
    "numpy>=1.26.4",
    "pyproj>=3.6.1",
    "laspy[lazrs]>=2.5.1",
    "scipy>=1.12.0",
    "trimesh>=4.2.0",
    "python-multipart>=0.0.9",
    "requests>=2.31.0",
    "geopandas>=0.14.3",
    "rasterio>=1.3.10",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
