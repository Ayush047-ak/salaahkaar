
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: salaahkaar_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-salaahkaar_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salaahkaar_password}
      POSTGRES_DB: ${POSTGRES_DB:-salaahkaar_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgres/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    networks:
      - salaahkaar_network

  neo4j:
    image: neo4j:5.19-community
    container_name: salaahkaar_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-salaahkaar_secret}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt
    volumes:
      - neo4j_data:/data
    networks:
      - salaahkaar_network

  geospatial-service:
    build:
      context: ./services/geospatial
      dockerfile: Dockerfile
    container_name: salaahkaar_geospatial
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GEOSPATIAL_PORT=8000
      - GEOSPATIAL_DEBUG=True
    volumes:
      - ./services/geospatial:/app
      - ./data:/data
    networks:
      - salaahkaar_network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: salaahkaar_api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=development
      - DATABASE_URL=postgresql://salaahkaar_user:salaahkaar_password@postgres:5432/salaahkaar_db
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=salaahkaar_secret
      - GEOSPATIAL_SERVICE_URL=http://geospatial-service:8000
    depends_on:
      - postgres
      - neo4j
      - geospatial-service
    networks:
      - salaahkaar_network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: salaahkaar_web
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:4000/api/v1
      - VITE_GEOSPATIAL_SERVICE_URL=http://localhost:8000
    depends_on:
      - api
    networks:
      - salaahkaar_network

volumes:
  postgres_data:
  neo4j_data:

networks:
  salaahkaar_network:
    driver: bridge
